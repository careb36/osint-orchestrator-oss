# Default values for osint-orchestrator.
#
# The orchestrator keeps its operational state in SQLite and runs the cron
# scheduler in-process, so it is a SINGLE-INSTANCE service: keep
# replicaCount at 1 and the Deployment strategy at Recreate. Two replicas
# would double-run every scheduled collection and corrupt the database.
# (ADR-005 records this decision.)

replicaCount: 1

image:
  # Published to GHCR by .github/workflows/docker-publish.yml: `:<version>`
  # and `:latest` on v* tags, `:main` and `:sha-<short>` on every push to
  # main. To run your own build instead, push it to your registry and set
  # repository/tag here:
  #   docker build -t <registry>/osint-orchestrator:0.1.0 . && docker push ...
  repository: ghcr.io/careb36/osint-orchestrator-oss
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as root by default; the pod security context drops to an
# unprivileged uid and fsGroup makes the PVC writable by it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # The app writes reports and the SQLite file under /app (mounted volumes),
  # and Python writes __pycache__ into the package dir on first import.
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: osint-orchestrator.example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

# One PVC holds both the SQLite database (/app/data) and the daily reports
# (/app/daily_reports). ReadWriteOnce is enough for a single replica.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  annotations: {}

# ─── Non-secret configuration (rendered into a ConfigMap as env vars) ────────
config:
  # In-cluster URLs of the platforms this orchestrator feeds and drives.
  # openctiEnabled: false runs without the knowledge graph (ADR-008): reports,
  # findings, the delta and alerts keep working; nothing is pushed to OpenCTI.
  openctiEnabled: true
  openctiUrl: http://opencti:8080
  openctiSslVerify: true
  spiderfootUrl: http://spiderfoot:5001
  spiderfootModules: sfp_dnsresolve,sfp_whois,sfp_sslcert
  # es | en — operator-facing text (ADR-004).
  language: es
  # json is the sensible default on Kubernetes: one object per line for the
  # log shipper. text for a human tailing kubectl logs.
  logFormat: json
  logLevel: INFO
  metricsEnabled: true
  llm:
    # ollama | anthropic | openai | nebius | none. Cloud providers need their
    # key under secrets.values (NEBIUS_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY).
    provider: ollama
    model: llama3.2
    baseUrl: http://ollama:11434
    # The two routes of the cloud providers (required for nebius): the fast
    # model qualifies web evidence, the reasoning model writes the synthesis.
    modelReasoning: ""
    modelFast: ""
  # Tavily web research (per-target opt-in; TAVILY_API_KEY under secrets.values).
  tavily:
    searchDepth: basic
    maxResults: 5
    maxCallsPerRun: 3
    timeoutSeconds: 120
  # Nightly purge of runs and report directories older than `days` (0 = off).
  retention:
    days: 90
    cron: "30 3 * * *"
  # Retry worker for failed alert deliveries.
  alertRetry:
    cron: "*/5 * * * *"
    maxAttempts: 4
    baseDelaySeconds: 30
    jitterRatio: 0.25
  alerts:
    webhookUrl: ""
    smtpHost: ""
    smtpPort: 587
    smtpFrom: ""
    emailTo: ""
    smtpStarttls: true
  # Any further ORCHESTRATOR / collector variable, verbatim.
  extraEnv: {}
  #  SYNTHESIS_HISTORY_RUNS: "5"

# ─── Secrets ─────────────────────────────────────────────────────────────────
# Either point existingSecret at a Secret you manage (External Secrets,
# Sealed Secrets, kubectl create secret ...) carrying the keys listed under
# `keys`, or fill the values below and the chart renders the Secret itself.
# Never commit real values in a values file.
secrets:
  existingSecret: ""
  values:
    OPENCTI_ADMIN_TOKEN: ""
    # Comma-separated list; empty = API open (a startup warning is logged).
    ORCHESTRATOR_API_KEY: ""
    ORCHESTRATOR_SECRET_KEY: ""
    # Keys retired by a rotation (comma-separated); verify-only.
    ORCHESTRATOR_SECRET_KEY_PREVIOUS: ""
    ALERT_WEBHOOK_SECRET: ""
    ALERT_SMTP_USER: ""
    ALERT_SMTP_PASSWORD: ""
    ANTHROPIC_API_KEY: ""
    OPENAI_API_KEY: ""
    NEBIUS_API_KEY: ""
    TAVILY_API_KEY: ""

# ─── Targets (targets.yaml) ──────────────────────────────────────────────────
# Either an existing ConfigMap with a `targets.yaml` key, or the target list
# inline. `authorization` and `purpose` are mandatory per target and are
# logged with every run — the audit trail lives here.
targets:
  existingConfigMap: ""
  targets: []
  #  - id: example-domain
  #    enabled: true
  #    fqdn: example.com
  #    authorization: "Self-owned. Authorised by: Jane Doe on 2026-09-01"
  #    purpose: "Continuous exposure monitoring"
  #    schedule:
  #      cron: "0 8 * * *"

# ─── Metrics ─────────────────────────────────────────────────────────────────
metrics:
  # prometheus.io/* pod annotations for annotation-based discovery.
  podAnnotations:
    enabled: true
  # ServiceMonitor for the Prometheus Operator (requires its CRDs).
  serviceMonitor:
    enabled: false
    interval: 60s
    scrapeTimeout: 10s
    labels: {}
    namespace: ""

# ─── Probes ──────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
# /ready answers 503 while the database is offline or the scheduler is not
# running, so readiness and startup use it; liveness stays on /health, which
# answers 200 as long as the process does.
readinessProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
startupProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 5
  failureThreshold: 24
