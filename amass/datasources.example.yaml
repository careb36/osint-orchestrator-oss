# amass/datasources.example.yaml — copy to amass/datasources.yaml and add the
# API keys of the data sources you want the engine to use.
#
#   cp amass/datasources.example.yaml amass/datasources.yaml
#
# amass/datasources.yaml is git-ignored: it holds secrets. It is mounted into
# the `amass` engine container and, read-only, into the orchestrator, because
# the Amass v5 *client* (oam_enum, running in the orchestrator) is what reads
# this file and forwards it to the engine inside the session configuration.
# Without it the run simply goes unauthenticated — no failure.
#
# Every source listed upstream works without credentials when its entry is
# absent; keyed sources return more (and rate-limit less). Full list of names:
# https://github.com/owasp-amass/amass/blob/main/resources/datasources.yaml
global_options:
  # Default TTL (minutes) when a data source does not specify a larger value.
  minimum_ttl: 1440

datasources:
