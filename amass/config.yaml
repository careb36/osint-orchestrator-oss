# amass/config.yaml — configuration of the Amass engine sidecar.
#
# Mounted read-only twice, because Amass v5 loads it in *both* places: at
# /.config/amass/config.yaml in the `amass` service, and at
# /app/amass/config/config.yaml in the orchestrator, whose CLI clients read it
# (and, through options.datasources below, the credentials) before posting the
# session configuration to the engine. Creating datasources.yaml is optional.
#
# Scope is intentionally empty: the orchestrator passes the domain of each
# target on the command line (oam_enum -d <fqdn>), so one engine serves every
# target. Data-source credentials live in datasources.yaml (git-ignored).
# Full reference: https://github.com/owasp-amass/amass/blob/main/resources/config.yaml
scope:
  ports: # ports probed when a target enables active mode
    - 80
    - 443
    - 8000
    - 8080
    - 8443
    - 8888
options:
  datasources: "./datasources.yaml"
  bruteforce:
    enabled: false # per-target via collectors.amass.brute
    wordlists:
      - "./wordlists/short-wordlist.txt"
  alterations:
    enabled: false
    wordlists:
      - "./wordlists/alterations.txt"
  default_transform_values:
    ttl: 1440 # minutes a finding is trusted before being re-checked (1 day)
    confidence: 50
    priority: 5
