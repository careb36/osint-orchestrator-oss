name: CI

# Runner: the repository variable CI_RUNS_ON (JSON) wins when it is set, e.g.
# '"ubuntu-latest"' to go back to GitHub-hosted. Unset, a private repository
# uses the self-hosted runner labelled `osint` and a public one GitHub-hosted:
# a self-hosted runner must never run pull requests from forks. The same
# expression is in every workflow. A self-hosted runner keeps its disk and has
# no sudo, so steps write only to the workspace and RUNNER_TEMP. See
# "CI runner" in CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # One run per pull request: a new push cancels the run of the commit it
  # replaces, so the single self-hosted runner does not build stale images.
  # Every other event (main, tags, dispatch) gets its own group and is never
  # cancelled, so each commit on main keeps its required checks.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || (github.event.repository.private && '["self-hosted","linux","x64","osint"]' || '"ubuntu-latest"')) }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # uv instead of setup-python, which has no Python builds for the
      # self-hosted runner's Ubuntu release. Pinned release with checksum,
      # installed under RUNNER_TEMP with the interpreter it downloads
      # (--no-bin skips the ~/.local/bin link): nothing is added to the runner
      # user's environment. The venv is fresh per run, so packages left by another
      # branch cannot hide a missing dependency.
      - name: Set up Python 3.11 (uv)
        shell: bash
        run: |
          cd "${RUNNER_TEMP}"
          curl -sSfL -o uv.tgz \
            https://github.com/astral-sh/uv/releases/download/0.12.24/uv-x86_64-unknown-linux-gnu.tar.gz
          echo "b4dfaef47d491a7296981f8374a4595f55dbf84e8937c8ecd2983574d8bb3da6  uv.tgz" | sha256sum -c -
          tar -xzf uv.tgz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          export UV_PYTHON_INSTALL_DIR="${RUNNER_TEMP}/uv-python"
          ./uv python install --no-bin 3.11
          ./uv venv --python 3.11 --managed-python --seed "${RUNNER_TEMP}/venv-3.11"
          echo "${RUNNER_TEMP}/venv-3.11/bin" >> "${GITHUB_PATH}"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install all runtime + dev deps from pyproject.toml (single source of truth — closes #6).
          # The openosint git dependency requires allow-direct-references = true (set in pyproject.toml).
          # The llm extra is what the image installs; without it the provider
          # import test always skipped here.
          pip install -e ".[dev,llm]"

      - name: Lint with ruff
        run: |
          ruff check orchestrator/ tests/
          ruff format --check orchestrator/ tests/

      # Blocking: mypy errors fail the job.
      - name: Type-check with mypy
        run: mypy orchestrator/ --ignore-missing-imports

      - name: Verify migrations match models
        run: |
          # Apply all migrations to a temporary SQLite database.
          # Under RUNNER_TEMP, emptied per job: on the self-hosted runner a
          # database left in /tmp by another branch's migrations would fail
          # the upgrade.
          export ORCHESTRATOR_DATABASE_URL="sqlite+aiosqlite:///${RUNNER_TEMP}/ci_migration_check.db"
          alembic upgrade head
          # Fail if any model change was made without a corresponding migration.
          alembic check
        env:
          OPENCTI_ADMIN_TOKEN: "test-token"
          ORCHESTRATOR_SECRET_KEY: "test-key"

      - name: Run unit tests (no integration)
        run: |
          pytest tests/unit/ -v -m "not integration"
        env:
          OPENCTI_ADMIN_TOKEN: "test-token"
          ORCHESTRATOR_SECRET_KEY: "test-key"

  frontend:
    name: Dashboard (lint, tests, build)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || (github.event.repository.private && '["self-hosted","linux","x64","osint"]' || '"ubuntu-latest"')) }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      # The orchestrator serves the build with `script-src 'self'`; an inline
      # script in index.html would be blocked by that CSP, so refuse it here.
      - name: Build has no inline script and resolves assets under /console/
        run: |
          ! grep -E '<script[^>]*>[^<]' dist/index.html
          grep -q 'src="/console/assets/' dist/index.html

  public-release-guard:
    name: Public-release guard
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || (github.event.repository.private && '["self-hosted","linux","x64","osint"]' || '"ubuntu-latest"')) }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Pinned release with checksum: the guard must not change under us.
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 gitleaks "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Forbidden references and secrets
        run: bash scripts/check_public_release.sh

  helm-chart:
    name: Helm chart
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || (github.event.repository.private && '["self-hosted","linux","x64","osint"]' || '"ubuntu-latest"')) }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # helm ships on ubuntu-latest runners; pin anyway so a runner image
      # update cannot change the lint result.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint chart
        run: helm lint deploy/helm/osint-orchestrator --strict

      - name: Render chart (defaults)
        run: helm template osint deploy/helm/osint-orchestrator --kube-version 1.30.0 > "${RUNNER_TEMP}/rendered-defaults.yaml"

      - name: Render chart (every optional resource on)
        run: |
          helm template osint deploy/helm/osint-orchestrator --kube-version 1.30.0 \
            --set ingress.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set secrets.values.ORCHESTRATOR_API_KEY=ci-only-placeholder \
            --set 'targets.targets[0].id=ci' \
            --set 'targets.targets[0].fqdn=example.com' \
            --set 'targets.targets[0].authorization=ci' \
            --set 'targets.targets[0].purpose=ci' \
            > "${RUNNER_TEMP}/rendered-full.yaml"
          grep -q "kind: Ingress" "${RUNNER_TEMP}/rendered-full.yaml"
          grep -q "kind: ServiceMonitor" "${RUNNER_TEMP}/rendered-full.yaml"
          grep -q "fqdn: example.com" "${RUNNER_TEMP}/rendered-full.yaml"
