name: Publish image

# Builds the orchestrator image and pushes it to GHCR so the Helm chart's
# default `image.repository` (ghcr.io/careb36/osint-orchestrator-oss) resolves.
#   - CI passes on main  → :main and :sha-<short>
#   - tag v*             → :<version>, :latest
#   - manual dispatch    → :sha-<short> only
# Pull requests only build (no push) to catch a broken Dockerfile early.
#
# Push to main is gated: the image is only built after the CI workflow
# (lint-and-test + helm-chart) succeeds on that commit.

on:
  # Gate main-branch pushes on a green CI run.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - orchestrator/**
      - ui/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

jobs:
  image:
    name: Build & push
    # For workflow_run events only proceed if CI succeeded.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run events check out the commit that CI ran on.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'osint-orchestrator:smoke' || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An SBOM attestation travels with every pushed image. The docker
          # exporter used by `load:` on pull requests cannot carry one.
          sbom: ${{ github.event_name != 'pull_request' }}

      # Known vulnerabilities in the OS packages and the Python dependencies of
      # the image built for this pull request. Pinned by commit (0.35.0).
      # The two Amass clients are upstream Go builds copied verbatim from the
      # pinned Amass image; their findings can only be fixed by bumping that
      # pin (its own commit), so they are reported by the next step instead of
      # failing every unrelated pull request here.
      - name: Scan the image for vulnerabilities
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: osint-orchestrator:smoke
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          skip-files: /usr/local/bin/oam_enum,/usr/local/bin/oam_subs

      - name: Report vulnerabilities in the bundled Amass clients (advisory)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: osint-orchestrator:smoke
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: library
          severity: CRITICAL,HIGH
          skip-dirs: /usr/local/lib,/usr/lib,/app
          skip-setup-trivy: true

      - name: Generate smoke API key
        if: github.event_name == 'pull_request'
        run: echo "ORCHESTRATOR_API_KEY=$(openssl rand -hex 32)" >> "${GITHUB_ENV}"

      - name: Smoke-test the image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -e ORCHESTRATOR_API_KEY osint-orchestrator:smoke \
            python -c "import orchestrator.api, pycti, magic, openai, anthropic; print('ok')"
          docker run --rm -e ORCHESTRATOR_API_KEY osint-orchestrator:smoke \
            python -c "from orchestrator.config import settings; print(settings.llm_provider)"

      - name: Smoke-test /health
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cid="$(docker run -d \
            -e ORCHESTRATOR_API_KEY \
            -p 18080:8000 \
            osint-orchestrator:smoke)"
          cleanup() {
            docker rm -f "${cid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          health_ok=0
          attempt=1
          # Retry for up to 60s (30 attempts, 2s apart).
          while [ "${attempt}" -le 30 ]; do
            if [ "$(docker inspect -f '{{.State.Running}}' "${cid}" 2>/dev/null || echo false)" != "true" ]; then
              echo "Smoke container exited before /health reported status=ok"
              docker logs "${cid}" || true
              exit 1
            fi
            if response="$(curl -fsS http://127.0.0.1:18080/health 2>/dev/null)"; then
              if printf '%s' "${response}" | python3 -c "import json, sys; payload=json.load(sys.stdin); sys.exit(0 if payload.get('status') == 'ok' else 1)"; then
                echo "${response}"
                health_ok=1
                break
              fi
            fi
            sleep 2
            attempt=$((attempt + 1))
          done

          if [ "${health_ok}" -ne 1 ]; then
            echo "Timed out waiting for /health to report status=ok"
            docker logs "${cid}" || true
            exit 1
          fi
