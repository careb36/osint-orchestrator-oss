# docker-compose.demo.yml
#
# Lightweight public demo: the orchestrator API and the demo page only.
# SQLite, no OpenCTI, no SpiderFoot, no Amass. Collectors: Tavily; LLM: the
# provider configured in .env (Nebius Token Factory + Nemotron for the demo).
#
#   cp .env.example .env    # NEBIUS_API_KEY, TAVILY_API_KEY, LLM_PROVIDER=nebius,
#                           # the two LLM_MODEL_* ids, ORCHESTRATOR_API_KEY,
#                           # ORCHESTRATOR_SECRET_KEY
#   docker compose -f docker-compose.demo.yml up -d --build
#   open http://localhost:7860/demo
#
# The service refuses to start if the demo configuration is unsafe to expose
# (see docs/operations.md, Demo mode).

services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    env_file: .env
    environment:
      # Fixed for the demo, whatever .env says.
      DEMO_MODE: "true"
      OPENCTI_ENABLED: "false"
      DEMO_TARGETS_FILE: demo/targets.demo.yaml
      TARGETS_FILE: demo/targets.demo.yaml
      ORCHESTRATOR_DATABASE_URL: sqlite+aiosqlite:////app/data/orchestrator.db
      # No reverse proxy in front when run locally.
      DEMO_TRUSTED_PROXY_HOPS: "0"
    ports:
      - "7860:7860"
    volumes:
      - demo-data:/app/data
      - demo-reports:/app/daily_reports

volumes:
  demo-data:
  demo-reports:
