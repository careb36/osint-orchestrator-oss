<!doctype html>
<html lang="{{ language }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none'%3E%3Crect x='2' y='2' width='44' height='44' rx='12' fill='%23081224' stroke='%2338bdf8' stroke-width='2.5'/%3E%3Ccircle cx='24' cy='24' r='15' stroke='%236366f1' stroke-width='2' stroke-dasharray='56 14'/%3E%3Cpath d='M15 16L24 24M35 13L24 24M14 33L24 24M34 33L24 24' stroke='%237dd3fc' stroke-width='1.8'/%3E%3Ccircle cx='15' cy='16' r='2.6' fill='%2338bdf8'/%3E%3Ccircle cx='35' cy='13' r='2.8' fill='%23a855f7'/%3E%3Ccircle cx='14' cy='33' r='2.4' fill='%236366f1'/%3E%3Ccircle cx='34' cy='33' r='2.6' fill='%2338bdf8'/%3E%3Ccircle cx='24' cy='24' r='3.4' fill='%23f8fafc' stroke='%2338bdf8' stroke-width='1.6'/%3E%3C/svg%3E"
    />
    <title>{{ landing_title }}</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Geist', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #dae2fd;
        background: #090d16;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(1100px 480px at 88% -10%, rgba(99, 102, 241, 0.08), transparent 60%),
          radial-gradient(900px 420px at 8% -8%, rgba(56, 189, 248, 0.07), transparent 60%),
          #090d16;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.25rem;
      }
      .shell {
        width: 100%;
        max-width: 52rem;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }
      .brand-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3rem;
        height: 3rem;
        border-radius: 0.5rem;
        box-shadow: 0 0 12px -2px rgba(56, 189, 248, 0.35);
      }
      .brand-mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .status-dot {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.3rem 0.7rem;
        border-radius: 9999px;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.62rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        background: rgba(16, 185, 129, 0.1);
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
      .status-dot::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
      }
      .card {
        padding: 2rem;
        border-radius: 0.5rem;
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 1px 0 rgba(56, 189, 248, 0.15);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
        line-height: 2.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #f8fafc;
      }
      p {
        margin: 0 0 1.5rem;
        color: #bdc8d1;
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
        gap: 0.75rem;
      }
      li {
        display: flex;
      }
      a {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 1rem 1.1rem;
        border-radius: 0.5rem;
        background: rgba(9, 13, 22, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #dae2fd;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.875rem;
        transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      }
      a::after {
        content: "→";
        color: #38bdf8;
        font-weight: 700;
        transition: transform 0.15s ease;
      }
      a:hover,
      a:focus-visible {
        background: rgba(56, 189, 248, 0.08);
        border-color: rgba(56, 189, 248, 0.45);
        box-shadow: 0 0 12px -2px rgba(56, 189, 248, 0.35);
      }
      a:hover::after,
      a:focus-visible::after {
        transform: translateX(3px);
      }
      li:last-child a {
        background: rgba(56, 189, 248, 0.1);
        border-color: rgba(56, 189, 248, 0.4);
        color: #f8fafc;
      }
      /* Keyboard focus: a solid outline that no per-link background or border
         override can hide (the hover glow alone is too faint to locate). */
      a:focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }
      code {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: #090d16;
        padding: 0.15rem 0.4rem;
        border-radius: 0.25rem;
        font-size: 0.85em;
        color: #7bd0ff;
      }
      @media (max-width: 600px) {
        body {
          padding: 1.25rem 1rem;
          justify-content: flex-start;
        }
        .card {
          padding: 1.5rem 1.25rem;
        }
        h1 {
          font-size: 1.6rem;
          line-height: 2rem;
        }
        ul {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="48" height="48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="osint-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#0c1930" />
                <stop offset="100%" stop-color="#070e1c" />
              </linearGradient>
              <linearGradient id="osint-ring" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="55%" stop-color="#6366f1" />
                <stop offset="100%" stop-color="#a855f7" />
              </linearGradient>
              <linearGradient id="osint-sweep" x1="24" y1="24" x2="39" y2="11" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38" />
                <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
              </linearGradient>
            </defs>
            <rect x="1.5" y="1.5" width="45" height="45" rx="12" fill="url(#osint-bg)" stroke="url(#osint-ring)" stroke-width="2" />
            <path d="M24 24L36.5 11.5A17.5 17.5 0 0 1 41.5 24H24Z" fill="url(#osint-sweep)" />
            <circle cx="24" cy="24" r="15.5" stroke="url(#osint-ring)" stroke-width="1.75" stroke-dasharray="58 14 18 10" stroke-linecap="round" />
            <circle cx="24" cy="24" r="9.5" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="1.2" />
            <path d="M24 5.5V9M24 39V42.5M5.5 24H9M39 24H42.5" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round" />
            <path d="M15 16L24 24M35 13L24 24M14 33L24 24M34 33L24 24" stroke="#7dd3fc" stroke-opacity="0.65" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="15" cy="16" r="2.4" fill="#38bdf8" />
            <circle cx="35" cy="13" r="2.6" fill="#a855f7" />
            <circle cx="14" cy="33" r="2.2" fill="#6366f1" />
            <circle cx="34" cy="33" r="2.4" fill="#38bdf8" />
            <circle cx="24" cy="24" r="4.6" fill="#38bdf8" fill-opacity="0.25" />
            <circle cx="24" cy="24" r="2.8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.4" />
          </svg>
        </span>
        <span class="status-dot">{{ landing_status }}</span>
      </div>
      <section class="card">
        <h1>{{ landing_heading }}</h1>
        <p>{{ landing_intro }}</p>
        <ul>
          <li><a href="/docs">{{ landing_docs }}</a></li>
          <li><a href="/health">{{ landing_health }}</a></li>
          <li><a href="/console">{{ landing_console }}</a></li>
        </ul>
      </section>
    </main>
  </body>
</html>
